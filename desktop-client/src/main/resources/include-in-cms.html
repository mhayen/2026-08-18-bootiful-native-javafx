<meta charset="utf-8">
<style>
    body {
        margin: 0;
    }

    iframe {
        display: block;
        background: #FFFFFF;
        border: none;
        height: 450px;
        width: 1000px;
    }

</style>

<div id="target">
    <iframe title="menukeuze" id="formulier-iframe"  style="display: block;background: #FFFFFF;border: none;"></iframe>
</div>
<script>
    const deploymentId = '<<<DEPLOYMENT_ID>>>' ;
    let formulierUrl = "https://script.google.com/macros/s/" + deploymentId + "/exec";
    const formulierNaam = '<<<FORMULIER_NAAM>>>';
    const queryString = globalThis.location.search;

    const urlParams = new URLSearchParams(queryString);
    if (urlParams.has('code')) {
        const code = urlParams.get('code')
        formulierUrl = formulierUrl + `?formName=${formulierNaam}&code=${code}`;
        const formIframe = document.getElementById("formulier-iframe");
        formIframe.src = formulierUrl;

        const pagina = document.getElementById("pagina-tekst");
        let contentHeight = 400;
        pagina.scrollIntoView({behavior: "smooth", block: "end", inline: "nearest"})
        window.addEventListener(
            'message',
            function (e) {
                // message that was passed from iframe page
                let message = e.data;
                let targetEl = document.getElementById("target");

                let clientWidth = targetEl.clientWidth;
                if (message.height &&  message.height !== contentHeight) {
                    formIframe.style.height = message.height + 'px';
                    contentHeight = message.height;
                    formIframe.style.width = clientWidth + 'px';
                }
                if (message.scroll) {
                    pagina.scrollIntoView(message.scroll)
                }
            }, false);
    } else {
        console.log('no code parameter found')
    }

</script>
